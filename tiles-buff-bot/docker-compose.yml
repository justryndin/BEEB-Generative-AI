services:
  web:
    build: .
    container_name: tiles-buff-site
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      # Та же база, что была у Telegram-бота: игроки и очередь переедут на сайт.
      - bot-data:/app/data
    ports:
      # Только для проверки с самого сервера (curl). Снаружи сайт доступен через Cloudflare Tunnel.
      - "127.0.0.1:8765:8000"
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  caddy:
    # Вариант «напрямую»: HTTPS на отдельном IP сервера (SITE_IP), сертификат выпускается сам.
    image: caddy:2
    container_name: tiles-buff-caddy
    profiles: ["direct"]
    restart: unless-stopped
    ports:
      - "${SITE_IP:-127.0.0.1}:80:80"
      - "${SITE_IP:-127.0.0.1}:443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  tunnel:
    # Вариант «через Cloudflare»: сайт сам подключается к Cloudflare, порты не нужны.
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    container_name: tiles-buff-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  bot-data:
  caddy-data:
  caddy-config:
