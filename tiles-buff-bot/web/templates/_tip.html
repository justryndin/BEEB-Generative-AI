<section class="card tip-card" id="tip" data-tip>
  <div class="tip-head"><h2 class="mb0">{{ ico("bulb") }}{{ _("Совет дня") if not tip_step else _("Совет") }}</h2><span class="badge">{{ _(tip.topic) }}</span></div>
  <p class="tip-text">{{ _(tip.text) }}</p>
  <div class="row">
    {% if tip.link %}<a class="btn btn-sm" href="{{ tip.link }}">{{ _("Подробнее →") }}</a>{% endif %}
    <a class="btn btn-sm btn-ghost" href="/?tip={{ tip_step + 1 }}#tip" data-next-tip="{{ tip_step + 1 }}">🔄 {{ _("Ещё совет") }}</a>
  </div>
</section>
